# AI/BI dashboard: batch monitoring (DAILY job tables) + live serving (the endpoints' AI Gateway
# inference tables). The file is generated by dashboards/build_ecg_demo_dashboard.py; its queries
# name bare tables, and dataset_catalog / dataset_schema point them at this deployment's schema.
# Deploying publishes it. Until the DAILY job has run and AI Gateway has delivered the first
# inference-table logs, the tiles of the respective section show errors (see the builder).
# The app (full target) embeds it: databricks.yml passes its id to the app's environment.
resources:
  dashboards:
    ecg12_afib_dashboard:
      # Both targets use mode: development, which prefixes "[dev <user>]".
      display_name: "ECG-AFib 12-lead Demo (batch + live)"
      file_path: ../dashboards/ecg12_afib.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      # The published dashboard runs its queries with the deploying identity's credentials, so
      # viewers (and the app's embed) need only CAN_READ on the dashboard, not grants on the
      # tables or the warehouse. The data is synthetic; set false to make every viewer's own
      # Unity Catalog grants apply instead.
      embed_credentials: true
      permissions:
        - group_name: ${var.viewer_group}
          level: CAN_READ
