# SETUP job: the model cycle, data first, with a validation gate before anything is served.
# Run once, and again to retrain.
#   01_generate_training_data -> training_data_12l (train / val / holdout)       standard serverless (env 6)
#   02_train_arr_model        -> bio_ecg12_arr new version @challenger           serverless GPU (A10 / AI v6)
#   03_train_afib_model       -> bio_ecg12_afib new version @challenger          serverless GPU (A10 / AI v6)
#                                (02_ and 03_ run in parallel, both after 01_)
#   04_validate_and_promote   -> both challengers scored on holdout vs the thresholds in common/config.py
#                                (+ hold-out evaluation artifacts in MLflow); both pass -> @champion moves
#                                to them, else the task fails and the job stops here
#                                                                                 serverless GPU (A10 / AI v6)
#   05_serve_endpoints        -> endpoints <endpoint_prefix>_arr + _afib at @champion, AI Gateway
#                                inference tables + usage tracking (+ the removeAfter tag when
#                                remove_after is set)                             standard serverless (env 6)
# The DAILY job (ecg12_afib_daily.job.yml) scores with the champion models; run this job first.
# Model names come from common/config.py; the catalog, schema, endpoint prefix and MLflow experiment
# from the bundle variables (job parameters catalog_name / schema_name / endpoint_prefix /
# mlflow_experiment). 02_, 03_ and 04_ log their runs to that one experiment.
# One schema per deployment: 01_ records this deployment (deployment_id) as the schema's owner on the
# first run and stops, before writing anything, when the schema belongs to another deployment (the
# model and table names are fixed, so two deployments in one schema would overwrite each other).
resources:
  jobs:
    ecg12_afib_setup:
      # Both targets use mode: development, which prefixes "[dev <user>]".
      name: biosignals_ecg12_afib_setup

      # Job parameters are passed to every task's notebook widgets of the same name.
      parameters:
        - name: catalog_name
          default: ${var.catalog}
        - name: schema_name
          default: ${var.schema}
        # Workspace-wide serving endpoint names <endpoint_prefix>_arr / _afib (05_serve_endpoints).
        - name: endpoint_prefix
          default: ${var.endpoint_prefix}
        # The one MLflow experiment the training (02_, 03_) and gate (04_) runs log to.
        - name: mlflow_experiment
          default: ${var.mlflow_experiment}
        # Optional expiry date: 05_serve_endpoints tags both endpoints removeAfter=<date> when set
        # (presets.tags reaches only bundle resources such as this job, not SDK-created endpoints).
        - name: remove_after
          default: ${var.remove_after}
        # This deployment's identity, <workspace id>:<bundle root path>: the workspace id is filled in
        # when the job runs, the bundle's folder when it is deployed. Same value in the DAILY job.
        - name: deployment_id
          default: "{{workspace.id}}:${workspace.root_path}"

      # Every task names its environment, so the versions each notebook's %pip line was checked
      # against (dev/tests/test_repo_consistency.py) stay what the task runs on; a task without one
      # gets the workspace's default version, which moves to new releases.
      environments:
        # Serverless GPU AI environment 6 (A10, torch 2.11.0 for CUDA 13, mlflow-skinny 3.13.0, the
        # models' version) for the PyTorch training and gate tasks.
        - environment_key: aiv6
          spec:
            base_environment: workspace-base-environments/databricks_ai_v6
        # Standard serverless environment 6 for the data generation and serving tasks (05_ installs
        # mlflow-skinny 3.13.0 over the 3.12.0 it ships).
        - environment_key: standard_v6
          spec:
            environment_version: "6"

      tasks:
        - task_key: generate_training_data
          notebook_task:
            notebook_path: ../workflow/01_generate_training_data.py
          environment_key: standard_v6

        - task_key: train_arr_model
          depends_on:
            - task_key: generate_training_data
          notebook_task:
            notebook_path: ../workflow/02_train_arr_model.py
          environment_key: aiv6
          compute:
            hardware_accelerator: GPU_1xA10

        - task_key: train_afib_model
          depends_on:
            - task_key: generate_training_data
          notebook_task:
            notebook_path: ../workflow/03_train_afib_model.py
          environment_key: aiv6
          compute:
            hardware_accelerator: GPU_1xA10

        # The gate: runs only when both training tasks succeeded (run_if default ALL_SUCCESS), and
        # fails (stopping serve_endpoints) when either challenger misses its thresholds.
        - task_key: validate_and_promote
          depends_on:
            - task_key: train_arr_model
            - task_key: train_afib_model
          notebook_task:
            notebook_path: ../workflow/04_validate_and_promote.py
          environment_key: aiv6
          compute:
            hardware_accelerator: GPU_1xA10

        - task_key: serve_endpoints
          depends_on:
            - task_key: validate_and_promote
          notebook_task:
            notebook_path: ../workflow/05_serve_endpoints.py
          environment_key: standard_v6
